[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuya-local-mcp"
version = "0.1.0"
description = "MCP server for controlling Tuya / Smart Life devices over the local network, with no cloud round-trip at runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ethanj2k" }]
keywords = ["mcp", "model-context-protocol", "tuya", "tinytuya", "smart-home", "home-automation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=2.0.0",
    "tinytuya>=1.13.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tuya-local-mcp = "tuya_local_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ethanj2k/tuya-local-mcp"
Issues = "https://github.com/ethanj2k/tuya-local-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tuya_local_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
